:root{--blue:#0044B9;--navy:#00235C;--shade:#001A3F;--deep:#00112B;--green:#0ACE00;--dim:#8CA3D6;--paper:#EAF0FF;--white:#fff}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#06070d;height:100%;overflow:hidden;font-family:Rajdhani,sans-serif}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
.stage{width:2304px;height:576px;position:relative;overflow:hidden;color:var(--paper);
  background:radial-gradient(130% 150% at 22% 8%,#073a9e 0%,#00235C 34%,#001A3F 60%,#00112B 100%);transform-origin:center}
.stage::before{content:"";position:absolute;inset:0;opacity:.05;mix-blend-mode:screen;z-index:0;
  background:radial-gradient(circle at 1px 1px,#bcd0ff 1.2px,transparent 1.4px);background-size:26px 26px}
#bg{position:absolute;inset:0;z-index:0}
.edge{position:absolute;top:0;bottom:0;width:10px;background:linear-gradient(180deg,var(--green),#06b000);z-index:5;
  animation:edgeglow 2.6s ease-in-out infinite}
.edge.l{left:0}.edge.r{right:0}
@keyframes edgeglow{0%,100%{box-shadow:0 0 18px rgba(10,206,0,.4)}50%{box-shadow:0 0 34px rgba(10,206,0,.8)}}
@keyframes cardglow{0%,100%{box-shadow:0 24px 70px rgba(0,0,0,.5),0 0 0 0 rgba(10,206,0,0)}
  50%{box-shadow:0 24px 70px rgba(0,0,0,.5),0 0 0 12px rgba(10,206,0,.16)}}
@keyframes capblink{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes hlshimmer{0%,100%{filter:drop-shadow(0 0 0 rgba(10,206,0,0))}50%{filter:drop-shadow(0 0 22px rgba(10,206,0,.5))}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.brand{position:absolute;top:34px;left:54px;display:flex;align-items:center;gap:18px;z-index:9}
.brand img{height:50px;display:block}
.brand .bk{font-weight:600;font-size:17px;letter-spacing:.16em;color:var(--dim);border-left:2px solid rgba(140,163,214,.45);padding-left:16px;line-height:1.25}
.brand .bk b{color:var(--paper);font-weight:700}

.scene{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .5s ease;z-index:1;
  display:flex;align-items:center;justify-content:center;padding:92px 90px 104px;text-align:center}
.scene.active{opacity:1}
@keyframes up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(22px) scale(.95)}to{opacity:1;transform:none}}
@keyframes grow{to{width:360px}}

/* QR / PESQUISA */
.qr{gap:96px}
.qr .txt{text-align:left;max-width:1120px}
.qr .ey{font-weight:700;letter-spacing:.26em;font-size:22px;color:var(--green)}
.qr.active .ey{animation:up .6s both}
.qr .big{font-weight:700;font-size:104px;line-height:.96;text-transform:uppercase;margin:16px 0 20px;text-shadow:0 6px 40px rgba(0,0,0,.45)}
.qr .big .g{color:var(--green)}
.qr.active .big{animation:pop .8s .15s both}
.qr .sub{font-weight:500;font-size:37px;color:#cfe0ff;line-height:1.25;max-width:17ch}
.qr.active .sub{animation:up .8s .4s both}
.qr .card{flex:0 0 auto;width:384px;background:#fff;border-radius:28px;padding:26px 26px 18px;
  box-shadow:0 24px 70px rgba(0,0,0,.5);display:flex;flex-direction:column;align-items:center;gap:12px}
.qr .card img{width:332px;height:332px;display:block}
.qr .card .cap{font-weight:700;letter-spacing:.14em;font-size:20px;color:#00112B}
.qr.active .card{animation:pop .9s .25s both, cardglow 2.6s 1.4s ease-in-out infinite}
.qr.active .card .cap{animation:capblink 1.7s 1.2s ease-in-out infinite}

/* MENSAGEM */
.msg{flex-direction:column}
.msg .ey{font-weight:700;letter-spacing:.3em;font-size:22px;color:var(--green)}
.msg.active .ey{animation:up .6s both}
.msg .hl{font-weight:700;font-size:78px;line-height:1.0;text-transform:uppercase;margin:18px 0 22px;max-width:30ch;text-shadow:0 6px 40px rgba(0,0,0,.45)}
.msg .hl .g{color:var(--green)}
.msg.active .hl{animation:pop .85s .15s both}
.msg.active .hl .g{animation:hlshimmer 2.6s 1s ease-in-out infinite}
.msg .bd{font-weight:500;font-size:34px;color:#cfe0ff;line-height:1.3;max-width:46ch}
.msg.active .bd{animation:up .85s .45s both}
.msg .cl{font-weight:700;font-size:34px;color:var(--white);margin-top:20px;letter-spacing:.01em}
.msg .cl .g{color:var(--green)}
.msg.active .cl{animation:up .9s .7s both}

/* LOGOS (reaproveita swall do auditório) */
.swall{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:40px;padding:22px 48px 88px}
.swall .grp{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}
.swall .lbl{font-weight:600;letter-spacing:.4em;font-size:17px;color:var(--green);text-indent:.4em}
.swall .logos{display:flex;align-items:center;justify-content:center;gap:40px;flex-wrap:nowrap}
.swall .logos img{width:auto;max-width:230px;opacity:.97}
.swall .patro img{height:46px}
.swall .patro .logos{gap:30px}
.swall .patro img.ikon{height:30px;max-width:260px}
.swall .apoio img{height:38px}
.swall .midia img{height:30px}
.swall .real img{height:48px}
.swall .div{width:380px;height:1px;background:linear-gradient(90deg,transparent,rgba(140,163,214,.3),transparent)}
.lg .top{position:absolute;top:70px;left:0;right:0;text-align:center;font-weight:700;letter-spacing:.28em;font-size:21px;color:var(--green)}
.lg.active .top{animation:up .7s both}
.lg.active .swall .grp{animation:up .7s both}
.lg.active .swall .grp:nth-child(2){animation-delay:.12s}
.lg.active .swall .grp:nth-child(3){animation-delay:.24s}
.lg.active .swall .grp:nth-child(4){animation-delay:.36s}
/* slides de logo grandes (um por categoria) */
.lgbig{flex-direction:column;gap:42px}
.lgbig .glbl{font-weight:700;letter-spacing:.34em;font-size:27px;color:var(--green);text-indent:.34em}
.lgbig .grow{display:flex;align-items:center;justify-content:center;gap:64px;flex-wrap:wrap;max-width:2060px}
.lgbig .grow img{width:auto;opacity:.98}
.lgbig.cpatro .grow img{height:84px}
.lgbig.cpatro .grow img.ikon{height:56px}
.lgbig.capoio .grow img{height:72px}
.lgbig.cmidia .grow img{height:60px}
.lgbig.creal .grow img{height:128px}
.lgbig.active .glbl{animation:up .6s both}
.lgbig.active .grow{animation:pop .85s .12s both}
/* slide final: happy hour + realização PATH */
.fin{flex-direction:column;gap:20px}
.fin .ey{font-weight:700;letter-spacing:.28em;font-size:20px;color:var(--green)}
.fin .hl{font-weight:700;font-size:70px;line-height:1.0;text-transform:uppercase;text-shadow:0 6px 40px rgba(0,0,0,.45)}
.fin .hl .g{color:var(--green)}
.fin .addr{font-weight:600;font-size:33px;color:#cfe0ff;letter-spacing:.01em}
.fin .addr b{color:var(--white)}
.fin .ades{font-weight:600;font-size:22px;color:var(--dim);letter-spacing:.04em}
.fin .real{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:10px}
.fin .real .rl{font-weight:600;letter-spacing:.34em;font-size:15px;color:var(--green)}
.fin .real img{height:66px}
.fin.active>*{animation:up .7s both}
.fin.active .hl{animation:pop .8s .1s both}
</style></head>

// fundo animado — rede de partículas (movimento contínuo = vídeo)
(function(){
  const cv=document.getElementById('bg'); if(!cv) return;
  const ctx=cv.getContext('2d'); const W=2304,H=576; cv.width=W; cv.height=H;
  const N=72, pts=[];
  for(let i=0;i<N;i++) pts.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*0.35,vy:(Math.random()-.5)*0.35,r:Math.random()*1.6+0.8});
  function step(){
    ctx.clearRect(0,0,W,H);
    for(const p of pts){p.x+=p.vx;p.y+=p.vy; if(p.x<0)p.x+=W; if(p.x>W)p.x-=W; if(p.y<0)p.y+=H; if(p.y>H)p.y-=H;}
    for(let i=0;i<N;i++)for(let j=i+1;j<N;j++){const a=pts[i],b=pts[j],dx=a.x-b.x,dy=a.y-b.y,d=Math.hypot(dx,dy);
      if(d<175){const o=(1-d/175)*0.22;ctx.strokeStyle='rgba(140,163,214,'+o+')';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}}
    for(const p of pts){ctx.fillStyle='rgba(180,208,255,.5)';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.3);ctx.fill();}
    requestAnimationFrame(step);
  }
