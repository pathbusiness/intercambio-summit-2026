:root{
  --summit:#0044B9; --navy:#00235C; --shade:#001A3F; --deep:#00112B;
  --green:#0ACE00; --white:#FFFFFF; --cloud:#F4F6FB; --mid:#9FB0D8;
  --font:"Rajdhani",Arial,Helvetica,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:var(--font);}
#fit{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;}

/* Palco fixo 1920x1080, escalado para caber em qualquer tela */
.stage{
  position:relative;width:1920px;height:1080px;overflow:hidden;color:var(--white);
  background:
    radial-gradient(130% 90% at 50% -10%, #0a4fd0 0%, var(--summit) 24%, var(--navy) 58%, var(--shade) 84%, var(--deep) 100%);
  transform-origin:center center;
}
canvas.net{position:absolute;inset:0;z-index:1;}

/* Dispositivo angular 45° da marca */
.canto45{position:absolute;top:0;right:0;z-index:4;width:200px;height:200px;
  background:var(--summit);clip-path:polygon(100% 0,100% 100%,0 0);opacity:.9;}
.plano45{position:absolute;left:0;bottom:0;z-index:2;width:420px;height:420px;
  background:rgba(0,68,185,.55);clip-path:polygon(0 0,100% 100%,0 100%);}

/* Vinheta para contraste */
.stage::after{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;
  background:radial-gradient(120% 80% at 50% 42%,transparent 52%,rgba(0,17,43,.55) 100%);}

/* Camada de conteúdo (cenas) */
.scenes{position:absolute;inset:0;z-index:5;}
.scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  opacity:0;visibility:hidden;text-align:center;padding:0 120px;}
.scene.active{opacity:1;visibility:visible;}

/* ---------- Logo Summit ---------- */
.summit-logo{height:150px;filter:drop-shadow(0 8px 34px rgba(0,0,0,.35));}
.scene.active .anim-logo{animation:logoIn 1.1s cubic-bezier(.19,1,.22,1) both;}
@keyframes logoIn{from{opacity:0;transform:translateY(34px) scale(.92);filter:blur(6px);}to{opacity:1;transform:none;filter:blur(0);}}

/* ---------- Tipografia ---------- */
.kicker{font-weight:600;letter-spacing:.42em;text-transform:uppercase;color:#BFD2FF;
  font-size:26px;display:flex;align-items:center;gap:22px;}
.kicker::before,.kicker::after{content:"";width:64px;height:2px;background:linear-gradient(90deg,transparent,#5A8BFF);}
.kicker::after{background:linear-gradient(90deg,#5A8BFF,transparent);}

.mega{font-weight:700;text-transform:uppercase;line-height:.92;letter-spacing:.01em;
  font-size:168px;text-shadow:0 10px 48px rgba(0,0,0,.35);}
.mega .em{color:#7FE27A;}
.sub{font-weight:500;font-size:46px;color:var(--cloud);letter-spacing:.02em;}
.meta{font-weight:600;font-size:34px;color:#CFE0FF;letter-spacing:.08em;text-transform:uppercase;
  display:flex;gap:30px;align-items:center;}
.meta .dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 16px var(--green);}

/* welcome multi-idioma */
.langs{display:flex;flex-wrap:wrap;justify-content:center;gap:14px 40px;max-width:1280px;margin-top:8px;}
.langs span{font-weight:500;font-size:30px;color:#8FA8DC;letter-spacing:.06em;opacity:.0;}
.scene.active .langs span{animation:fadeUp .7s ease both;}

/* ---------- Grades de logos ---------- */
.grid{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:40px;max-width:1560px;margin-top:14px;}
.chip{display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);
  border-radius:22px;backdrop-filter:blur(3px);opacity:0;}
.chip img{display:block;object-fit:contain;filter:drop-shadow(0 4px 12px rgba(0,0,0,.25));}
.scene.active .chip{animation:chipIn .8s cubic-bezier(.19,1,.22,1) both;}

/* patrocinadores: destaque maior */
.tier-spons .chip{width:430px;height:210px;padding:34px 46px;}
.tier-spons .chip img{max-width:100%;max-height:100%;}
/* apoiadores: menores, mais itens */
.tier-support .chip{width:330px;height:150px;padding:24px 34px;}
.tier-support .chip img{max-width:100%;max-height:100%;}
/* mídia */
.tier-media .chip{width:430px;height:190px;padding:30px 44px;}

/* ---------- animações base ---------- */
@keyframes fadeUp{from{opacity:0;transform:translateY(22px);}to{opacity:1;transform:none;}}
@keyframes chipIn{from{opacity:0;transform:translateY(40px) scale(.9);}to{opacity:1;transform:none;}}
.scene.active .fade{animation:fadeUp .9s ease both;}
.d1{animation-delay:.15s!important}.d2{animation-delay:.3s!important}.d3{animation-delay:.45s!important}
.d4{animation-delay:.6s!important}.d5{animation-delay:.75s!important}.d6{animation-delay:.9s!important}
.d7{animation-delay:1.05s!important}.d8{animation-delay:1.2s!important}

.stack{display:flex;flex-direction:column;align-items:center;gap:30px;}
.stack-sm{gap:18px;}

/* rodapé fixo com hashtag */
.footer{position:absolute;left:0;right:0;bottom:46px;z-index:6;display:flex;align-items:center;justify-content:center;gap:26px;
  font-weight:600;letter-spacing:.14em;font-size:26px;color:#AFC4F2;text-transform:uppercase;}
.footer .brand-mini{height:30px;opacity:.9;}
.footer .sep{width:6px;height:6px;border-radius:50%;background:#5A8BFF;}

/* barra de progresso do loop */
.progress{position:absolute;left:0;top:0;height:5px;z-index:7;background:linear-gradient(90deg,var(--green),#7FE27A);width:0;box-shadow:0 0 14px rgba(10,206,0,.6);}

/* pulso tech no título welcome */
.scene.active .pulse{animation:logoIn 1s cubic-bezier(.19,1,.22,1) both,glow 2.6s ease-in-out .9s infinite;}
@keyframes glow{0%,100%{text-shadow:0 10px 48px rgba(0,0,0,.35);}50%{text-shadow:0 10px 60px rgba(90,139,255,.45),0 0 40px rgba(127,226,122,.25);}}
</style>
</head>

<script>
/* ---------- Escala do palco para preencher a tela ---------- */
(function(){
  var stage=document.getElementById('stage');
  function fit(){
    var s=Math.min(window.innerWidth/1920, window.innerHeight/1080);
    stage.style.transform='scale('+s+')';
  }
  window.addEventListener('resize',fit); fit();
})();

/* ---------- Fundo: rede de partículas (tecnologia) ---------- */
(function(){
  var c=document.getElementById('net'), x=c.getContext('2d');
  var W=1920,H=1080; c.width=W; c.height=H;
  var N=Math.round(W*H/26000), pts=[];
  for(var i=0;i<N;i++){
    pts.push({x:Math.random()*W,y:Math.random()*H,
      vx:(Math.random()-.5)*.35,vy:(Math.random()-.5)*.35,r:Math.random()*1.8+.6});
  }
  var LINK=150;
  function frame(){
    x.clearRect(0,0,W,H);
    for(var i=0;i<N;i++){
      var p=pts[i]; p.x+=p.vx; p.y+=p.vy;
      if(p.x<0||p.x>W)p.vx*=-1; if(p.y<0||p.y>H)p.vy*=-1;
    }
    // linhas
    for(var i=0;i<N;i++){
      for(var j=i+1;j<N;j++){
        var a=pts[i],b=pts[j],dx=a.x-b.x,dy=a.y-b.y,d=Math.sqrt(dx*dx+dy*dy);
        if(d<LINK){
          var o=(1-d/LINK)*.5;
          x.strokeStyle='rgba(150,190,255,'+o+')'; x.lineWidth=1;
          x.beginPath(); x.moveTo(a.x,a.y); x.lineTo(b.x,b.y); x.stroke();
        }
      }
    }
    // nós
    for(var i=0;i<N;i++){
      var p=pts[i];
      x.fillStyle='rgba(200,222,255,.9)';
      x.beginPath(); x.arc(p.x,p.y,p.r,0,6.283); x.fill();
    }
    requestAnimationFrame(frame);
  }
  frame();
})();

/* ---------- Motor de cenas (loop infinito) ---------- */
(function(){
  var scenes=[].slice.call(document.querySelectorAll('.scene'));
  var prog=document.getElementById('progress');
  var i=-1, timer;
  function show(n){
    scenes.forEach(function(s){s.classList.remove('active');});
    var sc=scenes[n];
    // reinicia animações
    void sc.offsetWidth;
    sc.classList.add('active');
    var dur=parseInt(sc.getAttribute('data-dur'),10)||6000;
    prog.style.transition='none'; prog.style.width='0';
    void prog.offsetWidth;
    prog.style.transition='width '+dur+'ms linear'; prog.style.width='100%';
    timer=setTimeout(next,dur);
  }
  function next(){ i=(i+1)%scenes.length; show(i); }
  next();
})();
</script>
