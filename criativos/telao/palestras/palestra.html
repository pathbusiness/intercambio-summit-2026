:root{--blue:#0044B9;--navy:#00235C;--shade:#001A3F;--deep:#00112B;--green:#0ACE00;--dim:#8CA3D6;--paper:#EAF0FF;--white:#fff}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#06070d;height:100%;overflow:hidden;font-family:Rajdhani,sans-serif}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
.stage{width:2304px;height:576px;position:relative;overflow:hidden;color:var(--paper);
  background:radial-gradient(130% 150% at 22% 8%,#073a9e 0%,#00235C 34%,#001A3F 60%,#00112B 100%);transform-origin:center}
.stage::before{content:"";position:absolute;inset:0;opacity:.05;mix-blend-mode:screen;z-index:0;
  background:radial-gradient(circle at 1px 1px,#bcd0ff 1.2px,transparent 1.4px);background-size:26px 26px}
#bg{position:absolute;inset:0;z-index:0}
.edge{position:absolute;top:0;bottom:0;width:10px;background:linear-gradient(180deg,var(--green),#06b000);z-index:5;animation:edgeglow 2.6s ease-in-out infinite}
.edge.l{left:0}.edge.r{right:0}
@keyframes edgeglow{0%,100%{box-shadow:0 0 18px rgba(10,206,0,.4)}50%{box-shadow:0 0 34px rgba(10,206,0,.8)}}
@keyframes cardglow{0%,100%{box-shadow:0 24px 70px rgba(0,0,0,.5),0 0 0 0 rgba(10,206,0,0)}50%{box-shadow:0 24px 70px rgba(0,0,0,.5),0 0 0 12px rgba(10,206,0,.16)}}
@keyframes capblink{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(22px) scale(.95)}to{opacity:1;transform:none}}
.brand{position:absolute;top:34px;left:54px;display:flex;align-items:center;gap:18px;z-index:9}
.brand img{height:50px;display:block}
.brand .bk{font-weight:600;font-size:17px;letter-spacing:.16em;color:var(--dim);border-left:2px solid rgba(140,163,214,.45);padding-left:16px;line-height:1.25}
.brand .bk b{color:var(--paper);font-weight:700}
.scene{position:absolute;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;gap:92px;padding:92px 90px 104px}
.txt{text-align:left;max-width:1180px}
.ey{font-weight:700;letter-spacing:.24em;font-size:21px;color:var(--green);animation:up .6s both}
.big{font-weight:700;font-size:96px;line-height:.95;text-transform:uppercase;margin:14px 0 18px;text-shadow:0 6px 40px rgba(0,0,0,.45);animation:pop .8s .15s both}
.big .g{color:var(--green)}
.tema{font-weight:600;font-size:38px;color:var(--white);line-height:1.18;max-width:20ch;animation:up .8s .4s both}
.spk{font-weight:600;font-size:28px;color:#cfe0ff;margin-top:10px;animation:up .8s .55s both}
.spk b{color:var(--green)}
.card{flex:0 0 auto;width:380px;background:#fff;border-radius:28px;padding:26px 26px 18px;display:flex;flex-direction:column;align-items:center;gap:12px;
  box-shadow:0 24px 70px rgba(0,0,0,.5);animation:pop .9s .25s both, cardglow 2.6s 1.4s ease-in-out infinite}
.card img{width:328px;height:328px;display:block}
.card .cap{font-weight:700;letter-spacing:.14em;font-size:20px;color:#00112B;animation:capblink 1.7s 1.2s ease-in-out infinite}
</style></head>

<script>
(function(){const cv=document.getElementById('bg');const ctx=cv.getContext('2d');const W=2304,H=576;cv.width=W;cv.height=H;
 const N=72,pts=[];for(let i=0;i<N;i++)pts.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.35,vy:(Math.random()-.5)*.35,r:Math.random()*1.6+.8});
 function step(){ctx.clearRect(0,0,W,H);for(const p of pts){p.x+=p.vx;p.y+=p.vy;if(p.x<0)p.x+=W;if(p.x>W)p.x-=W;if(p.y<0)p.y+=H;if(p.y>H)p.y-=H;}
