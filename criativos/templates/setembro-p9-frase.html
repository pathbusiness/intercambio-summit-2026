<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>P9 versão B — card de frase 1080x1350</title>
<link rel="stylesheet" href="base.css">
<style>
  .canvas { background: var(--shade-navy); }
  .bg-foto img { object-position: center top; }
  .bg-foto::after {
    background: linear-gradient(to top, rgba(0,17,40,.98) 0%, rgba(0,26,63,.94) 55%, rgba(0,26,63,.90) 100%);
  }
  .titulo-sessao { position: absolute; left: var(--mx); right: var(--mx); top: 420px;
    font-weight: 700; font-size: 108px; line-height: 1.0; text-transform: uppercase;
    color: var(--white); }
  .subtitulo { position: absolute; left: var(--mx); right: var(--mx); top: 782px;
    font-weight: 500; font-size: 46px; line-height: 1.25; color: var(--mid-grey); }
  .assinatura { position: absolute; left: var(--mx); top: 1000px;
    font-weight: 600; font-size: 32px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--white); }
  .assinatura span { color: var(--mid-grey); }
  .quando { position: absolute; left: var(--mx); top: 1096px;
    font-weight: 600; font-size: 28px; letter-spacing: .10em; text-transform: uppercase;
    color: rgba(255,255,255,.66); }
</style>
</head>
<body>
<div class="canvas">
  <div class="bg-foto"><img src="../../site/assets/img/eventos/painel-2400.webp" alt=""></div>
  <div class="canto-45"></div>

  <div class="conteudo">
    <div class="topo-logo"><img src="../assets/marca/summit-logo-branco.png" alt="Intercâmbio Summit 2026"></div>

    <div class="titulo-sessao">IA E<br>AUTOMAÇÃO</div>
    <div class="subtitulo">atendimento, marketing e vendas com toque humano</div>
    <div class="assinatura">Myrko Micali <span>· Palestrante principal</span></div>
    <div class="quando">11 de novembro · São Paulo · Early Bird até 30/09</div>

    <div class="faixa-apoio">
      <img class="belta"   src="../assets/marca/apoio-belta-branco.png"   alt="BELTA">
      <img class="abrapei" src="../assets/marca/apoio-abrapei-branco.png" alt="ABRAPEI">
      <img class="ialc"    src="../assets/marca/apoio-ialc-branco.png"    alt="IALC">
      <img class="allyhub" src="../assets/marca/apoio-allyhub-branco.png" alt="Ally Hub">
      <img class="edvisor" src="../assets/marca/apoio-edvisor-branco.png" alt="Edvisor">
    </div>
  </div>
</div>
</body>
</html>
