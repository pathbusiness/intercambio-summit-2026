<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Prova social por e-mail — edição 2025 (600x420)</title>
<link rel="stylesheet" href="base.css">
<style>
  .canvas.prova { background: var(--deep-navy); display: flex; flex-direction: column; }
  .fotos { flex: 1; display: flex; gap: 3px; }
  .fotos figure { flex: 1; min-width: 0; height: 100%; overflow: hidden; }
  .fotos img { width: 100%; height: 100%; object-fit: cover; }
  .fotos .plateia img { object-position: center 35%; }
  .fotos .palestrante img { object-position: center 20%; }

  .legenda { flex: none; height: 96px; display: flex; flex-direction: column;
    justify-content: center; padding: 0 32px; }
  .legenda .kicker { font-family: var(--font); font-weight: 700; text-transform: uppercase;
    font-size: 13px; letter-spacing: .12em; color: var(--action-green); margin-bottom: 4px; }
  .legenda h3 { font-family: var(--font); font-weight: 600; font-size: 18px;
    color: var(--white); line-height: 1.2; }
</style>
</head>
<body>
<div class="canvas prova">
  <div class="fotos">
    <figure class="plateia">
      <img src="../../site/assets/img/eventos/plateia-2-1600.webp" alt="Plateia do Intercâmbio Summit 2025">
    </figure>
    <figure class="palestrante">
      <img src="../../site/assets/img/eventos/palestrante-close-1600.webp" alt="Palestrante no palco do Intercâmbio Summit 2025">
    </figure>
  </div>
  <div class="legenda">
    <p class="kicker">Edição 2025</p>
    <h3>O mercado reunido em um dia de conteúdo e negócios. 2026 é maior.</h3>
  </div>
</div>
</body>
</html>
