<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>P7 — Carrossel de temas: card final 1080x1350</title>
<link rel="stylesheet" href="base.css">
<style>
  .canvas { background: var(--deep-navy); }
  .bg-foto::after {
    background: linear-gradient(to top, rgba(0,26,63,.96) 0%, rgba(0,26,63,.84) 45%, rgba(0,35,92,.72) 100%);
  }
  .bloco-msg { position: absolute; left: var(--mx); top: 420px; }
  .titulo-hero { font-size: 104px; }
  .quando { margin-top: 26px; font-weight: 500; font-size: 42px; color: var(--white); }
  .bloco-oferta { position: absolute; left: var(--mx); top: 850px; }
  .bloco-oferta .lote { font-weight: 600; font-size: 30px; letter-spacing: .16em;
    text-transform: uppercase; color: var(--mid-grey); margin-bottom: 14px; }
  .cta-wrap { position: absolute; left: var(--mx); top: 1032px; }
</style>
</head>
<body>
<div class="canvas">
  <div class="bg-foto"><img src="../../site/assets/img/eventos/plateia-2400.webp" alt=""></div>
  <div class="canto-45 branco"></div>

  <div class="conteudo">
    <div class="topo-logo"><img src="../assets/marca/summit-logo-branco.png" alt="Intercâmbio Summit 2026"></div>

    <div class="bloco-msg">
      <div class="titulo-hero">GARANTA<br>SEU LUGAR</div>
      <div class="quando">11 de novembro · São Paulo · 144 lugares</div>
    </div>

    <div class="bloco-oferta">
      <div class="lote">Lote Early Bird · até 30/09</div>
      <div class="pill-preco">R$ 350 <span class="ou">ou 5x de R$ 70 sem juros</span></div>
    </div>

    <div class="cta-wrap"><span class="cta">intercambiosummit.com.br</span></div>

    <div class="faixa-apoio">
      <img class="belta"   src="../assets/marca/apoio-belta-branco.png"   alt="BELTA">
      <img class="abrapei" src="../assets/marca/apoio-abrapei-branco.png" alt="ABRAPEI">
      <img class="ialc"    src="../assets/marca/apoio-ialc-branco.png"    alt="IALC">
      <img class="allyhub" src="../assets/marca/apoio-allyhub-branco.png" alt="Ally Hub">
      <img class="edvisor" src="../assets/marca/apoio-edvisor-branco.png" alt="Edvisor">
    </div>
  </div>
</div>
</body>
</html>
