<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Campanha — palestrante 1080x1350</title>
<link rel="stylesheet" href="base.css">
<style>
  /* Retrato como painel deliberado (foto 800x800 já sobre o azul da marca),
     com keyline; nunca rosto atrás de texto. Mensagem à esquerda, 30–55%. */
  .bg-foto::after {
    background:
      linear-gradient(to bottom, rgba(0,26,63,.42) 0px, rgba(0,26,63,.58) 170px, rgba(0,26,63,.94) 310px, rgba(0,26,63,.97) 100%);
  }
  .bloco { position: absolute; left: var(--mx); width: 520px; top: 338px; }
  .kicker { font-weight: 600; text-transform: uppercase; letter-spacing: .2em;
    font-size: 28px; color: var(--mid-grey); margin-bottom: 26px; }
  .texto { margin-top: 30px; font-weight: 500; font-size: 38px; line-height: 1.24;
    color: var(--mid-grey); }
  .texto strong { color: var(--white); font-weight: 700; }
  .foto { position: absolute; top: 430px; right: 60px; width: 400px; height: 400px;
    border: 2px solid rgba(255,255,255,.30); }
  .foto img { width: 100%; height: 100%; object-fit: cover; }
  .legenda { position: absolute; top: 856px; right: 60px; width: 400px;
    font-weight: 700; font-size: 30px; letter-spacing: .04em; text-transform: uppercase;
    color: var(--white); }
  .legenda span { display: block; font-weight: 500; font-size: 25px; text-transform: none;
    letter-spacing: 0; line-height: 1.2; color: var(--mid-grey); margin-top: 6px; }
  .cta-wrap { position: absolute; left: var(--mx); top: 1030px; }
</style>
</head>
<body>
<div class="canvas">
  <div class="bg-foto"><img src="../../site/assets/img/eventos/{{BG}}.webp" alt="" style="object-position:center top;"></div>
  <div class="canto-45 {{CANTO}}"></div>

  <div class="conteudo">
    <div class="topo-logo"><img src="../assets/marca/summit-logo-branco.png" alt="Intercâmbio Summit 2026"></div>

    <div class="bloco">
      <div class="kicker">{{KICKER}}</div>
      <div class="titulo-hero" style="font-size:{{TSIZE}}px;">{{TITULO}}</div>
      <div class="texto">{{TEXTO}}</div>
    </div>

    <div class="foto"><img src="../../site/assets/img/palestrantes/{{SLUG}}-800.webp" alt="{{NOME}}"></div>
    <div class="legenda">{{NOME}}<span>{{CARGO}}</span></div>

    <div class="cta-wrap">{{CTA}}</div>

  </div>
</div>
</body>
</html>
