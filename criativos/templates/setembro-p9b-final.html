<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>P9b — Carrossel Myrko: card final 1080x1350</title>
<link rel="stylesheet" href="base.css">
<style>
  .canvas { background: var(--deep-navy); }
  .bg-foto::after {
    background: linear-gradient(to top, rgba(0,26,63,.96) 0%, rgba(0,26,63,.84) 45%, rgba(0,35,92,.72) 100%);
  }
  .bloco-msg { position: absolute; left: var(--mx); top: 380px; }
  .data-hero { font-size: 140px; }
  .cidade { margin-top: 8px; font-size: 42px; letter-spacing: .28em; }
  .meta { margin-top: 36px; font-size: 40px; }
  .meta .sep { color: rgba(255,255,255,.55); padding: 0 10px; }
  .prazo { position: absolute; left: var(--mx); top: 906px;
    font-weight: 600; font-size: 34px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--mid-grey); }
  .cta-wrap { position: absolute; left: var(--mx); top: 1010px; }
</style>
</head>
<body>
<div class="canvas">
  <div class="bg-foto"><img src="../../site/assets/img/eventos/plateia-2400.webp" alt=""></div>
  <div class="canto-45 branco"></div>

  <div class="conteudo">
    <div class="topo-logo"><img src="../assets/marca/summit-logo-branco.png" alt="Intercâmbio Summit 2026"></div>
    <div class="progresso">9/9</div>

    <div class="bloco-msg">
      <div class="titulo-hero data-hero">11 DE<br>NOVEMBRO</div>
      <div class="eyebrow cidade">São Paulo</div>
      <div class="linha-suporte meta"><strong>144 lugares</strong></div>
    </div>

    <div class="prazo">Early Bird até 30/09</div>
    <div class="cta-wrap"><span class="cta">intercambiosummit.com.br</span></div>

    <div class="faixa-apoio">
      <img class="belta"   src="../assets/marca/apoio-belta-branco.png"   alt="BELTA">
      <img class="abrapei" src="../assets/marca/apoio-abrapei-branco.png" alt="ABRAPEI">
      <img class="ialc"    src="../assets/marca/apoio-ialc-branco.png"    alt="IALC">
      <img class="allyhub" src="../assets/marca/apoio-allyhub-branco.png" alt="Ally Hub">
      <img class="edvisor" src="../assets/marca/apoio-edvisor-branco.png" alt="Edvisor">
    </div>
  </div>
</div>
</body>
</html>
