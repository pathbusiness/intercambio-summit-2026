<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Card de finalista com destaque do dossiê 1080x1350</title>
<link rel="stylesheet" href="base.css">
<style>
  .canvas { background: var(--deep-navy); }

  /* fundo: cenografia real do auditório (foto 2025) com véu forte;
     o retrato entra como PAINEL deliberado sobre ela.
     object-position no topo: a parede geométrica domina e as pessoas da
     foto ficam sob a zona mais escura do véu, atrás do bloco de nome */
  .bg-foto img { object-position: center top; }
  .bg-foto::after {
    background:
      linear-gradient(to top, rgba(0,26,63,.97) 0%, rgba(0,26,63,.91) 45%, rgba(0,35,92,.85) 100%);
  }

  /* O retrato 800x800 vem assentado no Summit Blue pelo pipeline
     (tools/build_images.py), com os olhos sempre no mesmo terço — é isso
     que mantém os 32 cards em série. */
  .foto { position: absolute; top: 158px; right: 60px; width: 520px; height: 520px;
    border: 2px solid rgba(255,255,255,.30); }
  .foto img { width: 100%; height: 100%; }

  /* lockup tipográfico do Prêmio (não existe arquivo de logo do Prêmio;
     pendente de aprovação — trocar por arquivo oficial se houver) */
  .premio-lockup { position: absolute; top: 170px; left: var(--mx); width: 330px; }
  .premio-lockup .p1 { font-weight: 700; font-size: 34px; text-transform: uppercase;
    letter-spacing: .06em; line-height: 1.04; }
  .premio-lockup .p2 { font-weight: 500; font-size: 25px; letter-spacing: .10em;
    text-transform: uppercase; color: var(--mid-grey); margin-top: 10px; }

  .selo-finalista { position: absolute; top: 380px; left: var(--mx);
    background: var(--white); color: var(--summit-blue);
    font-weight: 700; font-size: 40px; letter-spacing: .10em; text-transform: uppercase;
    padding: 16px 26px 18px;
    clip-path: polygon(0 0, 100% 0, 100% calc(100% - 22px), calc(100% - 22px) 100%, 0 100%); }

  .selo-trilha { position: absolute; top: 484px; left: var(--mx);
    display: inline-block; color: var(--white);
    font-weight: 600; font-size: 26px; letter-spacing: .22em; text-transform: uppercase;
    border: 2px solid rgba(255,255,255,.75); padding: 10px 18px 11px; }

  .bloco-nome { position: absolute; left: var(--mx); right: var(--mx); top: 716px; }
  .bloco-nome .nome { font-weight: 700; font-size: 96px; text-transform: uppercase;
    line-height: .96; letter-spacing: .005em; }
  .bloco-nome .categoria { margin-top: 14px; font-weight: 600; font-size: 40px;
    letter-spacing: .08em; text-transform: uppercase; color: var(--mid-grey); }
  .bloco-nome .quando { margin-top: 26px; font-weight: 500; font-size: 34px;
    letter-spacing: .06em; text-transform: uppercase; color: var(--white); }
  .bloco-nome .quando .sep { color: rgba(255,255,255,.55); padding: 0 12px; }
  .bloco-nome .nome { font-size: 88px; }
  .bloco-nome .cargo { margin-top: 10px; font-weight: 500; font-size: 30px; color: var(--mid-grey); }
  .bloco-nome .cargo:empty { display: none; }

  /* destaque do dossiê: só texto AUTORIZADO pelo finalista, até 240 caracteres */
  .destaque { position: absolute; left: var(--mx); right: var(--mx); top: 920px;
    border-left: 6px solid var(--white); padding: 4px 0 4px 28px; }
  .destaque .rot { font-weight: 600; font-size: 24px; letter-spacing: .24em; text-transform: uppercase;
    color: var(--mid-grey); margin-bottom: 14px; }
  .destaque .txt { font-weight: 500; font-size: 36px; line-height: 1.24; color: var(--white); }
  .destaque .fonte { margin-top: 16px; font-weight: 500; font-size: 24px; letter-spacing: .06em;
    text-transform: uppercase; color: rgba(255,255,255,.62); }
</style>
</head>
<body>
<div class="canvas">
  <div class="bg-foto"><img src="../../site/assets/img/eventos/premiados-2400.webp" alt=""></div>
  <!-- sobre fundo escuro o dispositivo angular é branco (manual, seção 06) -->
  <div class="canto-45 branco"></div>
  <div class="plano-45 branco" style="width:180px;height:180px;"></div>

  <div class="conteudo">
    <div class="topo-logo"><img src="../assets/marca/summit-logo-branco.png" alt="Intercâmbio Summit 2026"></div>

    <div class="foto"><img src="{{FOTO}}" alt="{{NOME}}"></div>

    <div class="premio-lockup">
      <div class="p1">Prêmio dos<br>Melhores<br>Profissionais<br>de Intercâmbio</div>
      <div class="p2">2026</div>
    </div>

    <div class="selo-finalista">Finalista 2026</div>
    <div class="selo-trilha">{{TRILHA}}</div>

    <div class="bloco-nome">
      <div class="nome">{{NOME}}</div>
      <div class="categoria">{{CATEGORIA}}</div>
      <div class="cargo">{{CARGO_EMPRESA}}</div>
    </div>

    <div class="destaque">
      <div class="rot">Destaque do dossiê</div>
      <div class="txt">{{RESUMO}}</div>
      <div class="fonte">Resumo autorizado pelo finalista</div>
    </div>

  </div>
</div>
</body>
</html>
