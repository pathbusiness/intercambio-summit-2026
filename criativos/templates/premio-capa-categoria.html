<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Prêmio — capa de categoria 1080x1350</title>
<link rel="stylesheet" href="base.css">
<style>
  /* sem foto de pessoa: cenografia tratada, categoria em tipografia grande */
  .canvas { background: var(--deep-navy); }
  .bg-foto img { object-position: center top; }
  .bg-foto::after {
    background: linear-gradient(to top, rgba(0,17,40,.97) 0%, rgba(0,26,63,.92) 50%, rgba(0,26,63,.86) 100%);
  }

  .premio-lockup { position: absolute; top: 220px; left: var(--mx); }
  .premio-lockup .p1 { font-weight: 600; font-size: 34px; letter-spacing: .12em;
    text-transform: uppercase; color: var(--mid-grey); }

  .selo-trilha { position: absolute; top: 320px; left: var(--mx);
    display: inline-block; color: var(--white);
    font-weight: 600; font-size: 26px; letter-spacing: .22em; text-transform: uppercase;
    border: 2px solid rgba(255,255,255,.75); padding: 10px 18px 11px; }

  /* 108px comporta "TRANSFORMADOR(A)" em uma linha */
  .categoria { position: absolute; left: var(--mx); right: var(--mx); top: 470px;
    font-weight: 700; font-size: 108px; line-height: 1.0; text-transform: uppercase;
    color: var(--white); }
  .descricao { position: absolute; left: var(--mx); right: var(--mx); top: 878px;
    font-weight: 500; font-size: 42px; line-height: 1.3; color: var(--mid-grey); }

  .finalistas-hint { position: absolute; left: var(--mx); top: 1064px;
    font-weight: 700; font-size: 34px; letter-spacing: .10em; text-transform: uppercase;
    color: var(--white); }
</style>
</head>
<body>
<div class="canvas">
  <div class="bg-foto"><img src="../../site/assets/img/eventos/trofeus-2400.webp" alt=""></div>
  <div class="canto-45 branco"></div>

  <div class="conteudo">
    <div class="topo-logo"><img src="../assets/marca/summit-logo-branco.png" alt="Intercâmbio Summit 2026"></div>

    <div class="premio-lockup"><div class="p1">Prêmio Melhores Profissionais 2026</div></div>
    <div class="selo-trilha">{{TRILHA}}</div>

    <div class="categoria">{{CATEGORIA}}</div>
    <div class="descricao">{{DESCRICAO}}</div>

    <div class="finalistas-hint">Conheça os finalistas &nbsp;&#8594;</div>

    <div class="faixa-apoio">
      <img class="belta"   src="../assets/marca/apoio-belta-branco.png"   alt="BELTA">
      <img class="abrapei" src="../assets/marca/apoio-abrapei-branco.png" alt="ABRAPEI">
      <img class="ialc"    src="../assets/marca/apoio-ialc-branco.png"    alt="IALC">
      <img class="allyhub" src="../assets/marca/apoio-allyhub-branco.png" alt="Ally Hub">
      <img class="edvisor" src="../assets/marca/apoio-edvisor-branco.png" alt="Edvisor">
    </div>
  </div>
</div>
</body>
</html>
