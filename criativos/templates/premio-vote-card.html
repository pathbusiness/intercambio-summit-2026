<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Prêmio — card de votação 1080x1350</title>
<link rel="stylesheet" href="base.css">
<style>
  /* mesma base do card de finalista, SEM faixa de apoiadores (limpo, foco
     no CTA de voto) e com selo VOTE + prazo + endereço do link */
  .canvas { background: var(--deep-navy); }
  .bg-foto img { object-position: center top; }
  .bg-foto::after {
    background: linear-gradient(to top, rgba(0,26,63,.97) 0%, rgba(0,26,63,.91) 45%, rgba(0,35,92,.85) 100%);
  }

  .foto { position: absolute; top: 158px; right: 60px; width: 660px; height: 660px;
    border: 2px solid rgba(255,255,255,.30); }
  .foto img { width: 100%; height: 100%; }

  .premio-lockup { position: absolute; top: 170px; left: var(--mx); width: 330px; }
  .premio-lockup .p1 { font-weight: 700; font-size: 40px; text-transform: uppercase;
    letter-spacing: .06em; line-height: 1.04; }
  .premio-lockup .p2 { font-weight: 500; font-size: 25px; letter-spacing: .10em;
    text-transform: uppercase; color: var(--mid-grey); margin-top: 10px; }

  .selo-finalista { position: absolute; top: 400px; left: var(--mx);
    background: var(--white); color: var(--summit-blue);
    font-weight: 700; font-size: 34px; letter-spacing: .10em; text-transform: uppercase;
    padding: 14px 22px 16px;
    clip-path: polygon(0 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%); }

  .selo-trilha { position: absolute; top: 500px; left: var(--mx);
    display: inline-block; color: var(--white);
    font-weight: 600; font-size: 24px; letter-spacing: .22em; text-transform: uppercase;
    border: 2px solid rgba(255,255,255,.75); padding: 9px 16px 10px; }

  .bloco-nome { position: absolute; left: var(--mx); right: var(--mx); top: 880px; }
  .bloco-nome .nome { font-weight: 700; font-size: 92px; text-transform: uppercase;
    line-height: .96; }
  .bloco-nome .categoria { margin-top: 12px; font-weight: 600; font-size: 38px;
    letter-spacing: .08em; text-transform: uppercase; color: var(--mid-grey); }

  .bloco-vote { position: absolute; left: var(--mx); right: var(--mx); top: 1096px;
    display: flex; align-items: center; gap: 30px; }
  .selo-vote { font-size: 44px; padding: 16px 40px 18px; }
  .vote-info .prazo { font-weight: 600; font-size: 30px; letter-spacing: .06em;
    text-transform: uppercase; color: var(--white); }
  .vote-info .url { font-weight: 700; font-size: 34px; color: var(--white); }
</style>
</head>
<body>
<div class="canvas">
  <div class="bg-foto"><img src="../../site/assets/img/eventos/premiados-2400.webp" alt=""></div>
  <div class="canto-45 branco"></div>

  <div class="conteudo">
    <div class="topo-logo"><img src="../assets/marca/summit-logo-branco.png" alt="Intercâmbio Summit 2026"></div>

    <div class="foto"><img src="{{FOTO}}" alt="{{NOME}}"></div>

    <div class="premio-lockup">
      <div class="p1">Prêmio<br>Melhores<br>Profissionais</div>
      <div class="p2">2026</div>
    </div>

    <div class="selo-finalista">Finalista 2026</div>
    <div class="selo-trilha">{{TRILHA}}</div>

    <div class="bloco-nome">
      <div class="nome">{{NOME}}</div>
      <div class="categoria">{{CATEGORIA}}</div>
    </div>

    <div class="bloco-vote">
      <span class="selo-vote">Vote</span>
      <div class="vote-info">
        <div class="prazo">Votação até 30 de outubro</div>
        <div class="url">{{URL}}</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
