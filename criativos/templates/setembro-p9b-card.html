<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>P9b — Carrossel Myrko: card de texto 1080x1350</title>
<link rel="stylesheet" href="base.css">
<style>
  .canvas { background: var(--shade-navy); }
  .bg-foto img { object-position: center top; }
  .bg-foto::after {
    background: linear-gradient(to top, rgba(0,17,40,.98) 0%, rgba(0,26,63,.94) 55%, rgba(0,26,63,.90) 100%);
  }
  .statement { top: 470px; font-size: 76px; line-height: 1.14;
    font-weight: 500; color: var(--mid-grey); }
  .statement strong { color: var(--white); font-weight: 700; }
  .assina { position: absolute; left: var(--mx); bottom: 150px;
    font-weight: 600; font-size: 28px; letter-spacing: .10em; text-transform: uppercase;
    color: rgba(255,255,255,.66); }
</style>
</head>
<body>
<div class="canvas">
  <div class="bg-foto"><img src="../../site/assets/img/eventos/palestrante-close-2400.webp" alt=""></div>

  <div class="conteudo">
    <div class="topo-logo"><img src="../assets/marca/summit-logo-branco.png" alt="Intercâmbio Summit 2026"></div>
    <div class="progresso">{{PROGRESSO}}</div>

    <div class="statement">{{TEXTO}}</div>

    <div class="assina">Myrko Micali · Intercâmbio Summit 2026</div>
  </div>
</div>
</body>
</html>
