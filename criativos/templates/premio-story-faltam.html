<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Prêmio — story "faltam X dias" 1080x1920</title>
<link rel="stylesheet" href="base.css">
<style>
  /* número editável: renderizar com DIAS=N
     (python3 criativos/render.py premio-story-faltam.html DIAS=3 ...)
     400px inferiores livres para o sticker de link */
  .canvas.story { background: var(--shade-navy); }
  .bg-foto img { object-position: center top; }
  .bg-foto::after {
    background: linear-gradient(to top, rgba(0,17,40,.97) 0%, rgba(0,26,63,.92) 45%, rgba(0,26,63,.86) 100%);
  }

  .contagem { position: absolute; left: var(--mx); top: 300px; }
  .contagem .faltam { font-weight: 600; font-size: 54px; letter-spacing: .24em;
    text-transform: uppercase; color: var(--mid-grey); }
  .contagem .dias { font-weight: 700; font-size: 330px; line-height: .95; color: var(--white); }
  .contagem .rotulo { font-weight: 700; font-size: 84px; letter-spacing: .10em;
    text-transform: uppercase; color: var(--white); }
  .contagem .prazo { margin-top: 26px; font-weight: 600; font-size: 32px; letter-spacing: .10em;
    text-transform: uppercase; color: var(--mid-grey); }

  .foto { position: absolute; top: 928px; right: 80px; width: 420px; height: 420px;
    border: 2px solid rgba(255,255,255,.30); }
  .foto img { width: 100%; height: 100%; }

  .bloco-nome { position: absolute; left: var(--mx); top: 1010px; width: 480px; }
  .bloco-nome .lockup { font-weight: 600; font-size: 26px; letter-spacing: .10em;
    text-transform: uppercase; color: var(--mid-grey); margin-bottom: 18px; }
  .bloco-nome .nome { font-weight: 700; font-size: 64px; text-transform: uppercase; line-height: 1.0; }
  .bloco-nome .categoria { margin-top: 10px; font-weight: 600; font-size: 30px;
    letter-spacing: .06em; text-transform: uppercase; color: var(--mid-grey); }

  .bloco-vote { position: absolute; left: var(--mx); top: 1418px;
    display: flex; align-items: center; gap: 26px; }
  .selo-vote { font-size: 44px; padding: 16px 40px 18px; }

  /* zona do sticker: nada abaixo de y=1520 */
</style>
</head>
<body>
<div class="canvas story">
  <div class="bg-foto"><img src="../../site/assets/img/eventos/premiados-2400.webp" alt=""></div>
  <div class="canto-45"></div>

  <div class="conteudo">
    <div class="topo-logo"><img src="../assets/marca/summit-logo-branco.png" alt="Intercâmbio Summit 2026"></div>

    <div class="contagem">
      <div class="faltam">Faltam</div>
      <div class="dias">{{DIAS}}</div>
      <div class="rotulo">dias</div>
      <div class="prazo">Votação até 30 de outubro</div>
    </div>

    <div class="foto"><img src="{{FOTO}}" alt="{{NOME}}"></div>

    <div class="bloco-nome">
      <div class="lockup">Prêmio Melhores Profissionais 2026</div>
      <div class="nome">{{NOME}}</div>
      <div class="categoria">{{CATEGORIA}}</div>
    </div>

    <div class="bloco-vote"><span class="selo-vote">Vote</span></div>
  </div>
</div>
</body>
</html>
