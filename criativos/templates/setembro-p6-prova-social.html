<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>P6 — Prova social 1080x1350</title>
<link rel="stylesheet" href="base.css">
<style>
  .bg-foto::after {
    background:
      linear-gradient(to top, rgba(0,26,63,.97) 0%, rgba(0,26,63,.86) 46%, rgba(0,35,92,.60) 100%);
  }

  .cabeca { position: absolute; left: var(--mx); top: 220px; }
  .cabeca .eyebrow { font-size: 30px; letter-spacing: .14em; color: var(--mid-grey); text-transform: none; }
  .cabeca .eyebrow strong { color: var(--white); }

  .numeros { position: absolute; left: var(--mx); right: var(--mx); top: 386px;
    display: flex; gap: 20px; }
  .num { flex: 1; background: rgba(0,26,63,.72); border-top: 4px solid var(--white);
    padding: 34px 28px 30px; }
  .num .v { font-weight: 700; font-size: 96px; line-height: 1; color: var(--white); }
  .num .l { margin-top: 12px; font-weight: 600; font-size: 28px; letter-spacing: .08em;
    text-transform: uppercase; color: var(--mid-grey); }

  .mudanca { position: absolute; left: var(--mx); right: var(--mx); top: 760px;
    font-weight: 500; font-size: 46px; line-height: 1.3; color: var(--white); }
  .mudanca strong { font-weight: 700; }
  .pedido { position: absolute; left: var(--mx); top: 1000px;
    font-weight: 700; font-size: 40px; color: var(--white); }

  .quando { position: absolute; left: var(--mx); top: 1096px;
    font-weight: 600; font-size: 28px; letter-spacing: .10em; text-transform: uppercase;
    color: var(--mid-grey); }
</style>
</head>
<body>
<div class="canvas">
  <div class="bg-foto"><img src="../../site/assets/img/eventos/plateia-2400.webp" alt=""></div>
  <div class="canto-45"></div>

  <div class="conteudo">
    <div class="topo-logo"><img src="../assets/marca/summit-logo-branco.png" alt="Intercâmbio Summit 2026"></div>

    <div class="cabeca">
      <div class="eyebrow"><strong>Intercâmbio Summit 2025,</strong> avaliado por quem esteve lá:</div>
    </div>

    <div class="numeros">
      <div class="num"><div class="v">9,3</div><div class="l">de 10 em satisfação</div></div>
      <div class="num"><div class="v">92</div><div class="l">NPS</div></div>
      <div class="num"><div class="v">0</div><div class="l">detratores</div></div>
    </div>

    <div class="mudanca">Em 2026: <strong>menos palestras, intervalos mais longos.</strong></div>
    <div class="pedido">Foi o que vocês pediram.</div>

    <div class="quando">11 de novembro · São Paulo · 144 lugares</div>

    <div class="faixa-apoio">
      <img class="belta"   src="../assets/marca/apoio-belta-branco.png"   alt="BELTA">
      <img class="abrapei" src="../assets/marca/apoio-abrapei-branco.png" alt="ABRAPEI">
      <img class="ialc"    src="../assets/marca/apoio-ialc-branco.png"    alt="IALC">
      <img class="allyhub" src="../assets/marca/apoio-allyhub-branco.png" alt="Ally Hub">
      <img class="edvisor" src="../assets/marca/apoio-edvisor-branco.png" alt="Edvisor">
    </div>
  </div>
</div>
</body>
</html>
