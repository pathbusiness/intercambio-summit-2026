<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Fixado 02 — O Tema 1080x1350</title>
<link rel="stylesheet" href="base.css">
<style>
  .canvas { background: var(--deep-navy); }
  .bg-foto img { object-position: center top; }
  .bg-foto::after {
    background: linear-gradient(to top, rgba(0,26,63,.97) 0%, rgba(0,26,63,.88) 45%, rgba(0,35,92,.78) 100%);
  }
  .tab-trio { position: absolute; top: 200px; left: var(--mx);
    background: var(--white); color: var(--summit-blue);
    font-weight: 700; font-size: 30px; letter-spacing: .12em; text-transform: uppercase;
    padding: 12px 22px 14px;
    clip-path: polygon(0 0, 100% 0, 100% calc(100% - 16px), calc(100% - 16px) 100%, 0 100%); }

  .bloco-msg { position: absolute; left: var(--mx); width: 560px; top: 372px; }
  .titulo-hero { font-size: 116px; }
  .sub { margin-top: 26px; font-weight: 500; font-size: 42px; line-height: 1.25;
    color: var(--mid-grey); }
  .sub strong { color: var(--white); font-weight: 700; }

  .foto { position: absolute; top: 470px; right: 60px; width: 400px; height: 400px;
    border: 2px solid rgba(255,255,255,.30); }
  .foto img { width: 100%; height: 100%; }
  .foto-legenda { position: absolute; top: 894px; right: 60px; width: 400px;
    font-weight: 600; font-size: 26px; letter-spacing: .04em; text-transform: uppercase;
    color: var(--white); text-align: left; }
  .foto-legenda span { display: block; font-weight: 500; font-size: 23px;
    text-transform: none; color: var(--mid-grey); margin-top: 4px; }

  .palestrante { position: absolute; left: var(--mx); top: 940px; width: 520px;
    font-weight: 600; font-size: 32px; letter-spacing: .10em; text-transform: uppercase;
    color: var(--mid-grey); }

  .quando { position: absolute; left: var(--mx); top: 1096px;
    font-weight: 600; font-size: 30px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--white); }
</style>
</head>
<body>
<div class="canvas">
  <div class="bg-foto"><img src="../../site/assets/img/eventos/palco-telao-2400.webp" alt=""></div>
  <div class="canto-45 branco"></div>

  <div class="conteudo">
    <div class="topo-logo"><img src="../assets/marca/summit-logo-branco.png" alt="Intercâmbio Summit 2026"></div>
    <div class="tab-trio">02 · O tema</div>

    <div class="bloco-msg">
      <div class="titulo-hero">IA NA<br>OPERAÇÃO</div>
      <div class="sub">atendimento, marketing e vendas com <strong>toque humano</strong></div>
    </div>

    <div class="foto"><img src="../../site/assets/img/palestrantes/myrko-micali-800.webp" alt="Myrko Micali"></div>
    <div class="foto-legenda">Myrko Micali<span>Palestrante principal · doubleX · NovaIA</span></div>

    <div class="palestrante">O tema que o próprio mercado escolheu</div>

    <div class="quando">11 de novembro · São Paulo</div>

    <div class="faixa-apoio">
      <img class="belta"   src="../assets/marca/apoio-belta-branco.png"   alt="BELTA">
      <img class="abrapei" src="../assets/marca/apoio-abrapei-branco.png" alt="ABRAPEI">
      <img class="ialc"    src="../assets/marca/apoio-ialc-branco.png"    alt="IALC">
      <img class="allyhub" src="../assets/marca/apoio-allyhub-branco.png" alt="Ally Hub">
      <img class="edvisor" src="../assets/marca/apoio-edvisor-branco.png" alt="Edvisor">
    </div>
  </div>
</div>
</body>
</html>
