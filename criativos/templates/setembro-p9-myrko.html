<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>P9 — Myrko Micali 1080x1350</title>
<link rel="stylesheet" href="base.css">
<style>
  .canvas { background: var(--deep-navy); }
  .bg-foto img { object-position: center top; }
  .bg-foto::after {
    background: linear-gradient(to top, rgba(0,26,63,.96) 0%, rgba(0,26,63,.86) 45%, rgba(0,35,92,.78) 100%);
  }

  .foto { position: absolute; top: 150px; right: 60px; width: 560px; height: 560px;
    border: 2px solid rgba(255,255,255,.30); }
  .foto img { width: 100%; height: 100%; }

  .eyebrow-p { position: absolute; top: 236px; left: var(--mx); width: 360px;
    font-weight: 600; font-size: 30px; letter-spacing: .16em; text-transform: uppercase;
    color: var(--mid-grey); }
  .bio { position: absolute; top: 320px; left: var(--mx); width: 360px;
    font-weight: 500; font-size: 30px; line-height: 1.3; color: var(--white); }

  .bloco-nome { position: absolute; left: var(--mx); right: var(--mx); top: 764px; }
  .bloco-nome .nome { font-weight: 700; font-size: 110px; text-transform: uppercase;
    line-height: .95; }
  .sessao { margin-top: 26px; font-weight: 700; font-size: 44px; text-transform: uppercase;
    line-height: 1.12; color: var(--white); }
  .sessao span { display: block; font-weight: 500; font-size: 36px; text-transform: none;
    color: var(--mid-grey); margin-top: 6px; }

  .quando { position: absolute; left: var(--mx); top: 1108px;
    font-weight: 600; font-size: 30px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--white); }
  .quando .destaque { color: var(--mid-grey); }
</style>
</head>
<body>
<div class="canvas">
  <div class="bg-foto"><img src="../../site/assets/img/eventos/palco-telao-2400.webp" alt=""></div>
  <div class="canto-45 branco"></div>

  <div class="conteudo">
    <div class="topo-logo"><img src="../assets/marca/summit-logo-branco.png" alt="Intercâmbio Summit 2026"></div>

    <div class="foto"><img src="../../site/assets/img/palestrantes/myrko-micali-800.webp" alt="Myrko Micali"></div>

    <div class="eyebrow-p">Palestrante<br>principal</div>
    <div class="bio">Fundador da Alfred Delivery. Hoje à frente da doubleX e da NovaIA.</div>

    <div class="bloco-nome">
      <div class="nome">MYRKO<br>MICALI</div>
      <div class="sessao">IA e Automação<span>atendimento, marketing e vendas com toque humano</span></div>
    </div>

    <div class="quando">11 de novembro · São Paulo <span class="destaque">· Early Bird até 30/09</span></div>

    <div class="faixa-apoio">
      <img class="belta"   src="../assets/marca/apoio-belta-branco.png"   alt="BELTA">
      <img class="abrapei" src="../assets/marca/apoio-abrapei-branco.png" alt="ABRAPEI">
      <img class="ialc"    src="../assets/marca/apoio-ialc-branco.png"    alt="IALC">
      <img class="allyhub" src="../assets/marca/apoio-allyhub-branco.png" alt="Ally Hub">
      <img class="edvisor" src="../assets/marca/apoio-edvisor-branco.png" alt="Edvisor">
    </div>
  </div>
</div>
</body>
</html>
