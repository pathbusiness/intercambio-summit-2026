<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>P1 — Save the Date 1080x1350</title>
<link rel="stylesheet" href="base.css">
<style>
  .bloco-msg { position: absolute; left: var(--mx); top: 386px; }
  .data-hero { font-size: 168px; }
  .cidade { margin-top: 6px; font-size: 44px; letter-spacing: .30em; }
  .meta { margin-top: 36px; font-size: 40px; }
  .meta .sep { color: rgba(255,255,255,.55); padding: 0 10px; }

  .bloco-abertura { position: absolute; left: var(--mx); top: 908px; }
  .pill-abertura { display: inline-block; background: var(--white); color: var(--summit-blue);
    font-weight: 700; font-size: 34px; letter-spacing: .04em; text-transform: uppercase;
    padding: 16px 28px 18px; }
  .lista { margin-top: 22px; font-weight: 600; font-size: 28px; letter-spacing: .05em;
    text-transform: uppercase; color: var(--white); }
  .cta-wrap { position: absolute; left: var(--mx); top: 1088px; }
  .cta { font-size: 32px; padding: 16px 34px 18px; }
</style>
</head>
<body>
<div class="canvas">
  <div class="bg-foto"><img src="../../site/assets/img/eventos/plateia-2400.webp" alt=""></div>
  <div class="canto-45"></div>

  <div class="conteudo">
    <div class="topo-logo"><img src="../assets/marca/summit-logo-branco.png" alt="Intercâmbio Summit 2026"></div>

    <div class="bloco-msg">
      <div class="titulo-hero data-hero">11 DE<br>NOVEMBRO</div>
      <div class="eyebrow cidade">São Paulo</div>
      <div class="linha-suporte meta"><strong>Intercâmbio Summit 2026</strong><span class="sep">·</span>144 lugares</div>
    </div>

    <div class="bloco-abertura">
      <div class="pill-abertura">Inscrições abertas</div>
      <div class="lista">Lote Early Bird · R$ 350 ou 5x de R$ 70 sem juros</div>
    </div>

    <div class="cta-wrap"><span class="cta">intercambiosummit.com.br</span></div>

    <div class="faixa-apoio">
      <img class="belta"   src="../assets/marca/apoio-belta-branco.png"   alt="BELTA">
      <img class="abrapei" src="../assets/marca/apoio-abrapei-branco.png" alt="ABRAPEI">
      <img class="ialc"    src="../assets/marca/apoio-ialc-branco.png"    alt="IALC">
      <img class="allyhub" src="../assets/marca/apoio-allyhub-branco.png" alt="Ally Hub">
      <img class="edvisor" src="../assets/marca/apoio-edvisor-branco.png" alt="Edvisor">
    </div>
  </div>
</div>
</body>
</html>
