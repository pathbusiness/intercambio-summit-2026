<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Campanha out/26 — story 1080x1920</title>
<link rel="stylesheet" href="base.css">
<style>
  /* Story: conteúdo essencial entre y≈300 e y≈1520 (UI do Instagram cobre o
     topo e a base). Onde há sticker (enquete, caixa, link), a zona
     y 1000–1500 fica vazia: {{ZONA}} = "sticker". */
  .canvas.story { background: var(--deep-navy); }
  .bg-foto::after {
    background:
      linear-gradient(to top, rgba(0,26,63,.97) 0%, rgba(0,26,63,.94) 40%, rgba(0,35,92,.90) 100%);
  }
  .topo-logo { top: 170px; left: 84px; }
  .topo-logo img { height: 88px; }

  .bloco { position: absolute; left: 84px; right: 84px; top: {{TOP}}px; }
  .kicker { font-weight: 600; text-transform: uppercase; letter-spacing: .2em;
    font-size: 32px; color: var(--mid-grey); margin-bottom: 30px; }
  .texto { margin-top: 34px; font-weight: 500; font-size: 52px; line-height: 1.22;
    color: var(--mid-grey); }
  .texto strong { color: var(--white); font-weight: 700; }
  .pill-wrap { margin-top: 44px; }
  .pill-wrap:empty, .cta-wrap:empty { display: none; }
  .cta-wrap { margin-top: 44px; }
  .pill-preco { font-size: 54px; }
  .pill-preco .ou { font-size: 36px; }
  .cta { font-size: 44px; padding: 24px 50px 26px; }
  .prazo { margin-top: 26px; font-weight: 600; font-size: 38px; letter-spacing: .14em;
    text-transform: uppercase; color: var(--mid-grey); }

  .faixa-apoio { bottom: 330px; gap: 64px; display: {{FAIXA}}; }
  .faixa-apoio img.belta   { height: 48px; }
  .faixa-apoio img.abrapei { height: 57px; }
  .faixa-apoio img.ialc    { height: 59px; }
  .faixa-apoio img.allyhub { height: 43px; }
  .faixa-apoio img.edvisor { height: 52px; }
</style>
</head>
<body>
<div class="canvas story" data-zona="{{ZONA}}">
  <div class="bg-foto"><img src="../../site/assets/img/eventos/{{BG}}-2400.webp" alt="" style="object-position:{{POS}};"></div>
  <div class="canto-45 {{CANTO}}"></div>

  <div class="conteudo">
    <div class="topo-logo"><img src="../assets/marca/summit-logo-branco.png" alt="Intercâmbio Summit 2026"></div>

    <div class="bloco">
      <div class="kicker">{{KICKER}}</div>
      <div class="titulo-hero" style="font-size:{{TSIZE}}px;">{{TITULO}}</div>
      <div class="texto">{{TEXTO}}</div>
      <div class="pill-wrap">{{PILL}}</div>
      <div class="cta-wrap">{{CTA}}</div>
    </div>

    <div class="faixa-apoio">
      <img class="belta"   src="../assets/marca/apoio-belta-branco.png"   alt="BELTA">
      <img class="abrapei" src="../assets/marca/apoio-abrapei-branco.png" alt="ABRAPEI">
      <img class="ialc"    src="../assets/marca/apoio-ialc-branco.png"    alt="IALC">
      <img class="allyhub" src="../assets/marca/apoio-allyhub-branco.png" alt="Ally Hub">
      <img class="edvisor" src="../assets/marca/apoio-edvisor-branco.png" alt="Edvisor">
    </div>
  </div>
</div>
</body>
</html>
