<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>P3 — Abertura de vendas 1080x1350</title>
<link rel="stylesheet" href="base.css">
<style>
  /* cenografia azul real do auditório, tratada para o Summit Blue dominar */
  .canvas { background: var(--deep-navy); }
  .bg-foto img { object-position: center top; }
  .bg-foto::after {
    background:
      linear-gradient(to top, rgba(0,26,63,.96) 0%, rgba(0,35,92,.78) 42%, rgba(0,68,185,.55) 100%);
  }

  .bloco-msg { position: absolute; left: var(--mx); top: 400px; }
  .titulo-hero { font-size: 128px; }
  .sub { margin-top: 24px; font-weight: 700; font-size: 52px; text-transform: uppercase; }
  .quando { margin-top: 10px; font-weight: 500; font-size: 40px; color: var(--mid-grey); }

  .bloco-oferta { position: absolute; left: var(--mx); top: 872px; }
  .bloco-oferta .lote { font-weight: 600; font-size: 32px; letter-spacing: .16em;
    text-transform: uppercase; color: var(--mid-grey); margin-bottom: 16px; }
  .cta-wrap { position: absolute; left: var(--mx); top: 1050px; }
</style>
</head>
<body>
<div class="canvas">
  <div class="bg-foto"><img src="../../site/assets/img/eventos/painel-2400.webp" alt=""></div>
  <div class="canto-45 branco"></div>

  <div class="conteudo">
    <div class="topo-logo"><img src="../assets/marca/summit-logo-branco.png" alt="Intercâmbio Summit 2026"></div>

    <div class="bloco-msg">
      <div class="titulo-hero">INSCRIÇÕES<br>ABERTAS</div>
      <div class="sub">Intercâmbio Summit 2026</div>
      <div class="quando">11 de novembro · São Paulo</div>
    </div>

    <div class="bloco-oferta">
      <div class="lote">Lote Early Bird</div>
      <div class="pill-preco">R$ 350 <span class="ou">ou 5x de R$ 70</span></div>
    </div>

    <div class="cta-wrap"><span class="cta">intercambiosummit.com.br</span></div>

    <div class="faixa-apoio">
      <img class="belta"   src="../assets/marca/apoio-belta-branco.png"   alt="BELTA">
      <img class="abrapei" src="../assets/marca/apoio-abrapei-branco.png" alt="ABRAPEI">
      <img class="ialc"    src="../assets/marca/apoio-ialc-branco.png"    alt="IALC">
      <img class="allyhub" src="../assets/marca/apoio-allyhub-branco.png" alt="Ally Hub">
      <img class="edvisor" src="../assets/marca/apoio-edvisor-branco.png" alt="Edvisor">
    </div>
  </div>
</div>
</body>
</html>
