<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>P2 — A pauta escolhida pelo público 1080x1350</title>
<link rel="stylesheet" href="base.css">
<style>
  /* foto do palestrante 2025 com o slide "4ª Revolução Industrial" */
  .bg-foto img { object-position: center 30%; }
  .bg-foto::after {
    background:
      linear-gradient(to top, rgba(0,26,63,.97) 0%, rgba(0,26,63,.80) 44%, rgba(0,35,92,.42) 74%, rgba(0,35,92,.30) 100%);
  }

  .rotulo-foto { position: absolute; top: 72px; right: 72px;
    font-weight: 600; font-size: 22px; letter-spacing: .16em; text-transform: uppercase;
    color: rgba(255,255,255,.75); }

  .statement { top: 560px; font-size: 62px; line-height: 1.16; font-weight: 500;
    color: var(--mid-grey); }
  .statement strong { color: var(--white); font-weight: 700; }
  .statement .fecho { display: block; margin-top: 34px; }

  .quando { position: absolute; left: var(--mx); top: 1096px;
    font-weight: 600; font-size: 30px; letter-spacing: .10em; text-transform: uppercase;
    color: var(--white); }
</style>
</head>
<body>
<div class="canvas">
  <div class="bg-foto"><img src="../../site/assets/img/eventos/palestra-telao-2400.webp" alt=""></div>
  <div class="canto-45"></div>

  <div class="conteudo">
    <div class="topo-logo"><img src="../assets/marca/summit-logo-branco.png" alt="Intercâmbio Summit 2026"></div>
    <div class="rotulo-foto">Intercâmbio Summit 2025</div>

    <div class="statement">
      Em 2025, perguntamos qual sessão foi a mais valiosa.
      A resposta mais citada foi <strong>inteligência artificial.</strong>
      <span class="fecho">Em 2026, ela virou <strong>o evento inteiro.</strong></span>
    </div>

    <div class="quando">Intercâmbio Summit 2026 · 11 de novembro · São Paulo</div>

    <div class="faixa-apoio">
      <img class="belta"   src="../assets/marca/apoio-belta-branco.png"   alt="BELTA">
      <img class="abrapei" src="../assets/marca/apoio-abrapei-branco.png" alt="ABRAPEI">
      <img class="ialc"    src="../assets/marca/apoio-ialc-branco.png"    alt="IALC">
      <img class="allyhub" src="../assets/marca/apoio-allyhub-branco.png" alt="Ally Hub">
      <img class="edvisor" src="../assets/marca/apoio-edvisor-branco.png" alt="Edvisor">
    </div>
  </div>
</div>
</body>
</html>
