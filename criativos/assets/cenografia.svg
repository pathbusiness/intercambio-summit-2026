<svg xmlns="http://www.w3.org/2000/svg" width="540" height="540" viewBox="0 0 540 540">
  <!-- Eco vetorial da cenografia geométrica do auditório (rosáceas circulares).
       Usar SEMPRE em opacidade baixa, como textura sobre Summit Blue / Deep Navy.
       Não é o mapa pontilhado do logotipo (que o manual proíbe extrair). -->
  <defs>
    <g id="roseta">
      <circle cx="0" cy="0" r="135" fill="none" stroke="#FFFFFF" stroke-width="10"/>
      <circle cx="0" cy="0" r="84"  fill="none" stroke="#FFFFFF" stroke-width="5"/>
      <circle cx="0" cy="0" r="30"  fill="none" stroke="#FFFFFF" stroke-width="5"/>
      <g fill="none" stroke="#FFFFFF" stroke-width="5">
        <circle cx="0"   cy="-57" r="27"/>
        <circle cx="40.3" cy="-40.3" r="27"/>
        <circle cx="57"  cy="0"   r="27"/>
        <circle cx="40.3" cy="40.3" r="27"/>
        <circle cx="0"   cy="57"  r="27"/>
        <circle cx="-40.3" cy="40.3" r="27"/>
        <circle cx="-57" cy="0"   r="27"/>
        <circle cx="-40.3" cy="-40.3" r="27"/>
      </g>
    </g>
  </defs>
  <use href="#roseta" x="0"   y="0"/>
  <use href="#roseta" x="270" y="0"/>
  <use href="#roseta" x="540" y="0"/>
  <use href="#roseta" x="135" y="270"/>
  <use href="#roseta" x="405" y="270"/>
  <use href="#roseta" x="0"   y="540"/>
  <use href="#roseta" x="270" y="540"/>
  <use href="#roseta" x="540" y="540"/>
</svg>
